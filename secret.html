      <a href="index.html">← pretend you saw nothing</a>

        Congratulations. Your prize is a sentence that changes whenever you reload:

      </p>
      <button onclick="document.getElementById('fortune').textContent = fortunes[Math.floor(Math.random()*fortunes.length)]">

      const fortunes = [
        "The website has accepted your browser as a distant cousin.",
